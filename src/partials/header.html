<header class="header">
  <div class="container header__inner">
    <a href="./" class="logo" aria-label="YourEnergy — на головну">
      <span class="logo__img" aria-hidden="true"></span>
    </a>

    <button

    <div class="header__nav" id="header-nav">

      <ul class="socials header__socials" aria-label="Соціальні мережі GoIT">

        <li>

        <li>
