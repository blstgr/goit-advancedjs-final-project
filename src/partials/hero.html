<section class="page-header container">
  <div class="page-header__title">
    <h1 class="page-header__heading">
      <img class="page-header__icon" src="/src/images/icon-sun.svg" alt="" width="60" height="59" />
      Get <em>Body</em> in shape, Stay healthy
    </h1>
    <p class="page-header__subtitle">
      Transform your physique and embrace a healthier lifestyle with our comprehensive fitness
      and nutrition support.
    </p>
  </div>

  <div class="page-header__media">
    <div class="page-header__media-frame">
      <img
        class="page-header__media-img"
        src="/src/images/home/hero-accent.jpg"
        srcset="/src/images/home/hero-accent.jpg 340w, /src/images/home/hero-accent@2x.jpg 680w"
        sizes="197px"
        alt=""
        loading="lazy"
        width="340"
        height="227"
      />
    </div>

    <ul class="pills page-header__pills">
      <li class="pill">#Sport</li>
      <li class="pill">#Healthy</li>
      <li class="pill">#Workout</li>
      <li class="pill">#Diet</li>
    </ul>
  </div>

  <div class="hero-banner">
    <picture>
      <source
        type="image/webp"
        srcset="/src/images/home/hero.webp 900w, /src/images/home/hero@2x.webp 1400w"
        sizes="100vw"
      />
      <img
        class="hero-banner__img"
        src="/src/images/home/hero.jpg"
        srcset="/src/images/home/hero.jpg 900w, /src/images/home/hero@2x.jpg 1400w"
        sizes="100vw"
        alt="Жінка займається спортом на свіжому повітрі"
        fetchpriority="high"
        width="900"
        height="600"
      />
    </picture>
  </div>
</section>
